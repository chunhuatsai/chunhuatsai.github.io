---
layout: default
---

<main class="container" id="main-content">
  <article class="section blog-post">
    <p class="eyebrow">Research Blog</p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%B %-d, %Y" }}
      {% if page.categories %}
        · {{ page.categories | join: ", " }}
      {% endif %}
    </p>

    {{ content }}

    <p class="mt-5"><a href="{{ '/blog/' | relative_url }}">Back to all posts</a></p>
  </article>
</main>

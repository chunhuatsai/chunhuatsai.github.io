<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      line-height: 1.6;
    }

    header {
      background: #f5f5f5;
      padding: 2rem;
      text-align: center;
    }

    .headshot {
      max-width: 220px;
      border-radius: 50%;
    }

    .section {
      padding: 2rem 1rem;
    }

    h1,
    h2,
    h3 {
      color: #1f2933;
    }

    h2 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 0.5rem;
      margin-top: 2rem;
    }

    .container ul {
      padding-left: 1.2rem;
    }

    .contact a {
      display: block;
    }

    nav a.nav-link.active {
      font-weight: bold;
    }

    .post-meta {
      color: #5f6c7b;
      font-size: 0.95rem;
    }

    .post-list {
      display: grid;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .post-list-item {
      border-bottom: 1px solid #d8dee6;
      padding-bottom: 1.5rem;
    }

    .post-list-item h2 {
      border-bottom: 0;
      margin-top: 0;
      padding-bottom: 0;
    }

    .blog-post {
      max-width: 820px;
    }

    .blog-post h1 {
      margin-bottom: 0.25rem;
    }

    .blog-post h2 {
      margin-top: 2.5rem;
    }

    .blog-post p,
    .blog-post li {
      font-size: 1.05rem;
    }

    .eyebrow {
      color: #376996;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }
  </style>
  {% if site.google_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
  {% endif %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">Chun-Hua Tsai</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">About</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ '/#publications' | relative_url }}">Publications</a></li>
        <li class="nav-item"><a class="nav-link{% if page.url contains '/blog/' %} active{% endif %}" href="{{ '/blog/' | relative_url }}">Blog</a></li>
      </ul>
    </div>
  </div>
</nav>

{{ content }}

<footer class="text-center py-4 bg-light">
  <small>Last Updated: {{ site.time | date: "%B %Y" }} | &copy; Chun-Hua Tsai</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  window.difyChatbotConfig = {
    token: 'u2lVGOywtbskHoUW',
    baseUrl: 'https://s1.cht77.com'
  };
</script>

</body>
</html>
